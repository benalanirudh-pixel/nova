<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Ledger</title>

<style>
:root{
  --desk:#C9D6C8;--paper:#F4F7EF;--bar:#E2EDDF;--head:#D6E3D3;--rule:#A7BAA9;--ink:#0F1E18;--dim:#3D5046;--faint:#566A5F;
  --pos:#0B4FA6;--neg:#B3200F;--pad:#FBF0B9;--padink:#3B2F07;--padrule:#D9C36A;--mark:#0F1E18;--markt:#F4F7EF;
  --sel:#0F1E18;--selt:#F4F7EF;--hp:11,79,166;--hn:179,32,15;
  --hatch:rgba(15,30,24,.2);
  --num:"Martian Mono",Consolas,monospace;--lab:"Archivo Narrow","Arial Narrow",sans-serif;--ser:"Newsreader",Georgia,serif;
}
:root[data-theme="dark"]{
  --desk:#3A2226;--paper:#1F1214;--bar:#2B1A1D;--head:#351F23;--rule:#54363B;--ink:#F5E9DF;--dim:#D2BDB2;--faint:#B59F95;
  --pos:#8FC2FF;--neg:#FF9A85;--pad:#3B2E12;--padink:#F6E6B4;--padrule:#7A6327;--mark:#0F0809;--markt:#F5E9DF;
  --sel:#F5E9DF;--selt:#1F1214;--hp:143,194,255;--hn:255,154,133;--hatch:rgba(245,233,223,.2);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#3A2226;--paper:#1F1214;--bar:#2B1A1D;--head:#351F23;--rule:#54363B;--ink:#F5E9DF;--dim:#D2BDB2;--faint:#B59F95;
  --pos:#8FC2FF;--neg:#FF9A85;--pad:#3B2E12;--padink:#F6E6B4;--padrule:#7A6327;--mark:#0F0809;--markt:#F5E9DF;
  --sel:#F5E9DF;--selt:#1F1214;--hp:143,194,255;--hn:255,154,133;--hatch:rgba(245,233,223,.2);
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:400 12.5px/1.3 var(--lab)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pos);outline-offset:-1px}
.app{height:100dvh;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:1px;background:var(--rule)}

/* masthead */
.mast{display:flex;align-items:stretch;background:var(--mark);color:var(--markt);min-height:36px}
.brand{display:flex;align-items:baseline;gap:7px;padding:7px 14px 0;font:500 21px/1 var(--ser);letter-spacing:-.01em}
.brand small{font:400 12px/1 var(--lab);opacity:.8;letter-spacing:0}
.cmd{flex:1;position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;border-left:1px solid color-mix(in srgb,var(--markt) 25%,transparent);min-width:180px}
.cmd>label{font:500 11px var(--num);font-stretch:75%}
.cmd input{flex:1;min-width:0;height:34px;border:0;outline:0;background:none;color:var(--markt);font:400 12px var(--num);font-stretch:75%}
.cmd input::placeholder{color:var(--markt);opacity:.65}
.hits{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--paper);color:var(--ink);border:1px solid var(--ink);max-height:320px;overflow:auto;display:none}
.hits.on{display:block}
.hits button{display:grid;grid-template-columns:96px 1fr auto;gap:10px;width:100%;padding:4px 10px;border:0;background:none;text-align:left;cursor:pointer}
.hits button.a,.hits button:hover{background:var(--sel);color:var(--selt)}
.hits b{font:500 11px var(--num);font-stretch:75%}
.st{display:flex;align-items:center;gap:14px;padding:0 12px;white-space:nowrap}
.st b{font-weight:600}
.tog{height:24px;padding:0 8px;background:none;border:1px solid color-mix(in srgb,var(--markt) 40%,transparent);color:var(--markt);cursor:pointer}
.tog:hover{background:var(--markt);color:var(--mark)}

/* index board */
.board{display:flex;overflow-x:auto;background:var(--paper);scrollbar-width:none}
.bd{flex:1 0 auto;padding:3px 11px 4px;border-right:1px solid var(--rule);white-space:nowrap}
.bd:last-child{border-right:0}
.bd u{display:block;text-decoration:none;color:var(--faint);font-size:12px}
.bd span{font:500 12px var(--num);font-stretch:75%}
.bd i{font:400 11px var(--num);font-stretch:75%;font-style:normal;margin-left:6px}

/* tabs */
.tabs{display:flex;overflow-x:auto;background:var(--head);scrollbar-width:none}
.tabs button{flex:0 0 auto;display:flex;align-items:baseline;gap:6px;height:28px;padding:0 13px;border:0;border-right:1px solid var(--rule);background:none;cursor:pointer;font-weight:600;font-size:13px}
.tabs button kbd{font:400 10px var(--num);font-stretch:75%;color:var(--faint)}
.tabs button:hover{background:var(--paper)}
.tabs button[aria-current=page]{background:var(--ink);color:var(--paper)}
.tabs button[aria-current=page] kbd{color:var(--paper)}

/* view + panes */
#view{display:grid;gap:1px;min-height:0;min-width:0;background:var(--rule);overflow:hidden}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper);overflow:hidden}
.ph{flex:none;display:flex;align-items:baseline;gap:8px;padding:3px 8px;background:var(--head);border-bottom:1px solid var(--rule)}
.ph h2{margin:0;font:700 13px/1.25 var(--lab);white-space:nowrap}
.ph .src{flex:1;min-width:0;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk{flex:none;font:500 10.5px/1.5 var(--num);font-stretch:75%;padding:0 5px;white-space:nowrap}
.tk.ok{color:var(--pos)}
.tk.bad,.bad-c{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 4px);color:var(--ink);outline:1px dashed var(--faint);outline-offset:-1px}
.body{flex:1;min-height:0;overflow:auto}
.pad{padding:7px 9px}

/* tables */
table{width:100%;border-collapse:separate;border-spacing:0}
th{position:sticky;top:0;z-index:2;background:var(--paper);font:600 12px/1.2 var(--lab);color:var(--dim);text-align:right;padding:3px 7px;border-bottom:1px solid var(--ink);white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
th.grp{border-bottom:1px solid var(--rule);text-align:center;color:var(--ink)}
td{font:400 11.2px/1.5 var(--num);font-stretch:75%;text-align:right;padding:1px 7px;white-space:nowrap}
td.t,th.t{text-align:left}
td.t{font:400 12.5px/1.3 var(--lab)}
td.sym{font-weight:600}
td.w{white-space:normal;min-width:180px}
tbody tr:nth-child(6n+4) td,tbody tr:nth-child(6n+5) td,tbody tr:nth-child(6n+6) td{background-color:var(--bar)}
tbody tr[data-sym]{cursor:pointer}
tbody tr[data-sym]:hover td,tbody tr.on td{background:var(--sel)!important;color:var(--selt)!important}
tbody tr[data-sym]:hover td *,tbody tr.on td *{color:inherit!important}
tr.tot td{border-top:1px solid var(--ink);font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.dim{color:var(--faint)}
td.spot{background:var(--ink)!important;color:var(--paper)!important;font-weight:600}
.cell-bad{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 4px)!important;outline:1px dashed var(--faint);outline-offset:-1px}

/* key-value sheets */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 18px}
.kv div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid var(--bar)}
.kv u{text-decoration:none;color:var(--dim)}
.kv b{font:500 11.2px/1.5 var(--num);font-stretch:75%;white-space:nowrap}

/* legal pad: Nova's reading only */
.note{background:var(--pad);color:var(--padink)}
.note .ph{background:var(--pad);border-bottom:1px solid var(--padrule)}
.note .ph h2,.note .ph .src{color:var(--padink)}
.note h1{margin:0 0 6px;font:500 27px/1.08 var(--ser);letter-spacing:-.012em;text-wrap:balance}
.note p{margin:0 0 6px;font:400 15px/1.34 var(--ser)}
.note ul{margin:0;padding:0;list-style:none}
.note li{font:400 14.5px/1.3 var(--ser);padding:3px 0;border-bottom:1px solid var(--padrule)}
.note li:last-child{border-bottom:0}
.note li em{font-style:normal;font:600 12px var(--lab);margin-right:6px}

/* security head */
.qh{display:flex;flex-wrap:wrap;gap:4px 28px;align-items:baseline;padding:6px 10px;border-bottom:1px solid var(--rule)}
.qh h1{margin:0;font:500 25px/1.1 var(--ser);letter-spacing:-.01em}
.qh .px{font:500 21px var(--num);font-stretch:75%}
.seg{display:flex;gap:0;margin-left:auto}
.seg button{height:20px;padding:0 8px;border:1px solid var(--rule);margin-left:-1px;background:var(--paper);cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.scr-bar{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--rule)}
.scr-bar input,.scr-bar select{height:24px;background:var(--paper);border:1px solid var(--rule);padding:0 6px}
.scr-bar label{color:var(--dim)}
.chip{height:24px;padding:0 9px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{margin-left:auto;font:400 11px var(--num);font-stretch:75%;color:var(--dim)}

/* footer */
.foot{display:flex;flex-wrap:wrap;gap:2px 16px;align-items:center;padding:3px 10px;background:var(--mark);color:var(--markt);font-size:12px}
.foot .k{margin-left:auto;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center}
.foot .k span{display:inline-flex;gap:5px;align-items:center}
.foot i{width:14px;height:10px;display:inline-block}
.foot .kp{background:var(--pad)}
.foot .ki{background:var(--markt)}
.foot .kh{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--markt) 70%,transparent) 0 1px,transparent 1px 4px);outline:1px dashed var(--markt)}

@media (min-width:2100px){.app{zoom:1.3;height:calc(100dvh/1.3)}}
@media (max-width:1050px){
  .app{height:auto;min-height:100dvh}
  #view{display:block;overflow:visible}
  .pane{margin-bottom:1px;max-height:none}
  .body{overflow-x:auto;overflow-y:visible}
  .pane.tall .body{max-height:520px;overflow-y:auto}
  .st span:first-child{display:none}
  th{position:static}
}
</style>

function table(cols,rows,o={}){
  const S=o.id&&state.sort[o.id];
  if(S){const c=cols[S.i],g=typeof c[1]==='function'?(c[2]?.v||c[1]):r=>r[c[1]];rows=[...rows].sort((a,b)=>{const x=g(a),y=g(b);return(typeof x==='string'||typeof y==='string'?String(x).localeCompare(String(y)):(y??-1e12)-(x??-1e12))*(S.d)})}
  const head=(o.groups?`<tr>${o.groups.map(g=>`<th class="grp" colspan="${g[1]}">${g[0]}</th>`).join('')}</tr>`:'')+'<tr>'+cols.map((c,i)=>{const x=c[2]||{},on=S&&S.i===i;return`<th class="${x.t?'t ':''}${o.id?'s':''}" ${o.id?`data-sort="${o.id}:${i}" tabindex="0" aria-sort="${on?(S.d>0?'descending':'ascending'):'none'}"`:''}>${c[0]}${on?(S.d>0?' ▾':' ▴'):''}</th>`}).join('')+'</tr>';
  const lim=o.limit?rows.slice(0,o.limit):rows;
  const body=lim.map(r=>`<tr ${o.sym?`data-sym="${esc(o.sym(r))}"`:''} class="${o.rc?o.rc(r):''}">`+cols.map(c=>{const x=c[2]||{};const raw=typeof c[1]==='function'?c[1](r):r[c[1]];const hv=x.h?(x.hv?x.hv(r):raw):null;return`<td class="${x.t?'t ':''}${x.c||''} ${x.bad?.(r)?'cell-bad':''}" ${x.h?`style="${heat(hv,x.h)}"`:''}>${raw==null?'∅':raw}</td>`}).join('')+'</tr>').join('');
  return`<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

  ['Buy',r=>num(r.dii_buy,0)],['Sell',r=>num(r.dii_sell,0)],['Net',r=>A(r.dii_net),{h:12000,hv:r=>r.dii_net}],
  ['Combined',r=>A(r.combined_net)],['Source',r=>pri(r)?'✓ NSE primary':'~ '+esc(r.source.split(':').pop()),{t:1,bad:r=>!pri(r)}],['Scope',r=>r.scoped?'Combined':'≠ NSE only',{t:1,bad:r=>!r.scoped}]
 ],D.frows,{groups:[['',3],['FII',4],['DII',3],['',3]]}),{cls:'tall'})
 +pane('qual','Source quality',esc(F.source_quality.replace(/_/g,' ').toLowerCase()),'part',`<div class="pad">`+kv([['History sessions',F.history_sessions],['Target sessions',F.target_sessions],['Primary in target',F.primary_source_sessions_in_target_window],['Non-primary',F.non_primary_sessions_in_target_window],['Primary coverage',num(F.primary_coverage_ratio*100,0)+'%'],['Days to full',F.trading_days_to_full_primary_estimate],['Rows off scope',F.rows_outside_target_scope],['Invalid rows',F.invalid_rows],['FII streak',F.fii_streak_direction.toLowerCase()+' '+F.fii_streak_days+'d'],['DII streak',F.dii_streak_direction.toLowerCase()+' '+F.dii_streak_days+'d'],['Signal allowed',D.signal.allowed?'yes':'no']])+`</div>`+table([['Source',r=>esc(r[0]),{t:1}],['Sessions',r=>r[1]]],Object.entries(F.source_counts))+`<div class="pad"><b style="font-size:13px">Flow behaviour, target scope</b>`+kv(flowStats())+`</div>`)
 +pane('rd','Nova read','Rule-based','',`<p>Regime label reads FII selling, DII absorption. The last ${F.fii_streak_days} sessions run the other way: FII buying, DII selling.</p><p>Five days do not offset ${acc(F.fii_20d)} Cr over twenty, and ${F.non_primary_sessions_in_target_window} of those twenty are unverified.</p>`,{cls:'note',pad:1});
},
SCREEN(){
 view.style.cssText='grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"s"';
 const PR={all:['All',()=>1],high:['New 52W high',r=>r.dh===0],near:['Within 5% of high',r=>isN(r.dh)&&Math.abs(r.dh)<=5],vol:['Rel vol ≥ 2x',r=>r.rv>=2],up:['Strong up',r=>r.t==='Strong up'],rs:['RS leaders',r=>r.rs20>=10&&r.rs60>=10],over:['RSI ≥ 70',r=>r.rsi>=70],sold:['RSI ≤ 30',r=>r.rsi<=30],low:['Near 52W low',r=>isN(r.dl)&&r.dl<=5],down:['Strong down',r=>r.t==='Strong down']};
 let rows=SCAN.filter(PR[state.preset][1]);
 if(state.sector)rows=rows.filter(r=>r.x===state.sector);
 const q=state.q.trim().toUpperCase();if(q)rows=rows.filter(r=>r.s.includes(q)||r.n.toUpperCase().includes(q));
 const secs=[...new Set(SCAN.map(r=>r.x).filter(Boolean))].sort();
 const bar=`<div class="scr-bar">${Object.entries(PR).map(([k,v])=>`<button type="button" class="chip" data-preset="${k}" aria-pressed="${state.preset===k}">${v[0]}</button>`).join('')}<label>Filter <input id="sq" value="${esc(state.q)}" size="14" aria-label="Filter by symbol or name"></label><label>Sector <select id="ss" aria-label="Sector"><option value="">All sectors</option>${secs.map(s=>`<option ${s===state.sector?'selected':''}>${esc(s)}</option>`).join('')}</select></label><span class="count">${num(rows.length,0)} of ${num(SCAN.length,0)}, first 300 shown. Click a header to sort</span></div>`;
 const t=table([
  ['Rank','rk'],['Symbol','s',{t:1,c:'sym'}],['Company',r=>esc(r.n.slice(0,30)),{t:1,v:r=>r.n}],['Sector',r=>esc(r.x.slice(0,22)),{t:1,v:r=>r.x}],['Last',r=>num(r.p),{v:r=>r.p}],
  ['1D',r=>P(r.r1),{v:r=>r.r1,h:8,hv:r=>r.r1}],['5D',r=>P(r.r5),{v:r=>r.r5,h:16,hv:r=>r.r5}],['20D',r=>P(r.r20,1),{v:r=>r.r20,h:30,hv:r=>r.r20}],['60D',r=>P(r.r60,1),{v:r=>r.r60,h:50,hv:r=>r.r60}],
  ['RS 20D',r=>sg(r.rs20,1),{v:r=>r.rs20}],['vs EMA 20',r=>P(r.e20,1),{v:r=>r.e20}],['vs EMA 200',r=>P(r.e200,1),{v:r=>r.e200}],['RSI',r=>num(r.rsi,1),{v:r=>r.rsi}],['ATR%',r=>num(r.atr),{v:r=>r.atr}],
  ['Rel vol',r=>num(r.rv,1)+'x',{v:r=>r.rv}],['Value Cr',r=>num(r.val,1),{v:r=>r.val}],['From hi',r=>P(r.dh,1),{v:r=>r.dh}],['Trend','t',{t:1}],['Score',r=>num(r.sc,0),{v:r=>r.sc}]
 ],rows,{id:'scr',sym:r=>r.s,limit:300});
 return`<section class="pane tall" style="grid-area:s" aria-label="Screener"><div class="ph"><h2>Screener</h2><span class="src">Full NSE universe, 4 Nov scan. A screen is a filter, not a recommendation</span><span class="tk ok">✓ tied</span></div>${bar}<div class="body">${t}</div></section>`;
},
SECTORS(){
 view.style.cssText='grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"s"';
 const tt=table([
  ['Sector','n',{t:1,c:'sym'}],['Stocks','c'],['Adv',r=>r.adv,{v:r=>r.adv}],['Dec',r=>r.dec,{v:r=>r.dec}],
  ['1D',r=>P(r.r1),{v:r=>r.r1,h:3,hv:r=>r.r1}],['5D',r=>P(r.r5),{v:r=>r.r5,h:10,hv:r=>r.r5}],['20D',r=>P(r.r20,1),{v:r=>r.r20,h:15,hv:r=>r.r20}],['60D',r=>P(r.r60,1),{v:r=>r.r60,h:25,hv:r=>r.r60}],['RS 20D',r=>sg(r.rs20,1),{v:r=>r.rs20}],
  ['> EMA 20',r=>num(r.a20,0)+'%',{v:r=>r.a20,h:100,hv:r=>r.a20-50}],['> EMA 50',r=>num(r.a50,0)+'%',{v:r=>r.a50,h:100,hv:r=>r.a50-50}],['> EMA 200',r=>num(r.a200,0)+'%',{v:r=>r.a200,h:100,hv:r=>r.a200-50}],
  ['RSI',r=>num(r.rsi,1),{v:r=>r.rsi}],['Rel vol',r=>num(r.rv,2)+'x',{v:r=>r.rv}],['ATR%',r=>num(r.atr),{v:r=>r.atr}],['Score',r=>num(r.sc,0),{v:r=>r.sc}],['Value Cr',r=>num(r.val,0),{v:r=>r.val}],
  ['Best 1D',r=>r.best+' '+pct(r.bestr,1),{t:1,v:r=>r.bestr}],['Worst 1D',r=>r.worst+' '+pct(r.worstr,1),{t:1,v:r=>r.worstr}]
 ],D.sec,{id:'sec',sym:r=>'@'+r.n});
 return`<section class="pane tall" style="grid-area:s" aria-label="Sectors"><div class="ph"><h2>Sectors</h2><span class="src">Equal-weight means recomputed from the 4 Nov scan, because the report’s own sector file is from 8 Oct. Click a sector to open it in Screener</span><span class="tk bad">~ partial</span></div><div class="body">${tt}</div></section>`;
},
NOTE(){
 view.style.cssText='grid-template-columns:minmax(0,3.5fr) minmax(0,2.5fr) minmax(0,3.2fr) minmax(0,3.2fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"call pre f0 f1" "news pre f2 f3"';
 const po=D.preopen,poT=(t,a)=>`<div style="padding:7px 8px 0"><b style="font-size:13px">${t}</b>${table([['Symbol','symbol',{t:1,c:'sym'}],['IEP',r=>num(r.iep)],['Chg',r=>P(r.change_pct)],['Cr',r=>num(r.turnover_cr,1)]],a,{sym:r=>r.symbol})}</div>`;
 const scr=(i,a)=>{const s=D.focus.screens[i];return pane(a,esc(s.title),esc(s.rule),'ok',table([['Symbol','symbol',{t:1,c:'sym'}],['Last',r=>num(r.price)],['1D',r=>P(r.return_1d,1)],['20D',r=>P(r.return_20d,1)],['RSI',r=>num(r.rsi_14,0)],['Rel vol',r=>num(r.relative_volume,1)+'x'],['From hi',r=>P(r.distance_52w_high,1)]],s.rows,{sym:r=>r.symbol}))};
 return pane('call','Morning call',`Written from data at ${D.snapAt.slice(11,16)} UTC`,'',`<h1>Session note</h1><ul>${D.call.map(c=>`<li><em>${esc(c.topic)}</em>${esc(c.text)}</li>`).join('')}</ul>`,{cls:'note',pad:1})
 +pane('pre','Pre-open',esc(po.timestamp)+', turnover ≥ '+po.min_turnover_cr+' Cr','ok',`<div class="pad">`+kv([['Advancing',num(po.advances,0)],['Declining',num(po.declines,0)],['Unchanged',num(po.unchanged,0)]])+`</div>`+poT('Gainers',po.gainers)+poT('Losers',po.losers)+poT('Most active',po.most_active))
 +scr(0,'f0')+scr(1,'f1')+scr(2,'f2')+scr(3,'f3')
 +pane('news','Headlines',`${D.news.length} items, Google News`,'',table([['Headline',r=>esc(r.t),{t:1,c:'w'}],['Source',r=>esc(r.s),{t:1}]],D.news));
},
AUDIT(){
 view.style.cssText='grid-template-columns:minmax(0,6.6fr) minmax(0,2.8fr) minmax(0,2.6fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"conf eng pol" "gap eng pol" "rf eng pol"';
 const rfT=a=>table([['#','rank'],['Symbol','symbol',{t:1,c:'sym'}],['Last',r=>num(r.price)],['Composite z',r=>`<span class="${cls(r.composite_z)}">${sg(r.composite_z)}</span>`],['Factors',r=>'∅',{bad:()=>1}]],a,{sym:r=>r.symbol});
 const eng=Object.entries(D.da),off=eng.filter(e=>!/AVAILABLE$|READY/.test(e[1])||e[1]==='NOT AVAILABLE');
 return pane('conf','Conflicts',`${conflicts.length} places where two Nova sources disagree`,'',table([['Line',r=>r[0],{t:1,c:'sym'}],['What disagrees',r=>r[1],{t:1,c:'w'}],['Why it matters',r=>esc(r[2]),{t:1,c:'w'}],['',r=>'≠',{bad:()=>1}]],conflicts))
 +pane('gap','Stale or missing',`${gaps.length} items`,'',table([['Line',r=>r[0],{t:1,c:'sym'}],['State',r=>r[1],{t:1,c:'w'}],['',r=>TK[r[2]][0],{bad:()=>1}]],gaps))
 +pane('rf','Research factor ranks','Top and bottom 10 of '+num(D.stocks,0)+'. Inputs, not forecasts','part',`<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule)"><div style="background:var(--paper)">${rfT(D.rfTop)}</div><div style="background:var(--paper)">${rfT(D.rfBot)}</div></div>`)
 +pane('eng','Engines',`${eng.length-off.length} of ${eng.length} ready`,off.length?'part':'ok',table([['Engine',r=>esc(r[0].replace(/_/g,' ')),{t:1}],['State',r=>esc(r[1].toLowerCase()),{t:1,bad:r=>r[1]==='NOT AVAILABLE'}]],eng))
 +pane('pol','Decision policy','Fixed by Nova, shown here so it can be checked','ok',table([['Rule',r=>esc(r[0].replace(/_/g,' ').toLowerCase()),{t:1}],['Value',r=>String(r[1])]],Object.entries(D.policy))+`<div class="pad" style="font-size:12.5px;line-height:1.4"><b>buy_sell_authorized: false</b>${D.rfWarn.map(w=>`<p style="margin:6px 0 0">${esc(w)}</p>`).join('')}</div>`);
}};
const TABS=[['MARKET','Market'],['SEC','Security'],['OPT','F&amp;O'],['FLOWS','Flows'],['SCREEN','Screener'],['SECTORS','Sectors'],['NOTE','Note'],['AUDIT','Audit']];

function board(){
 const g=D.glob,it=[['Nifty 50',num(K.nifty.price),K.nifty.change_percent],['Bank Nifty',num(K.banknifty.price),K.banknifty.change_percent],['Sensex',num(D.chains.SENSEX.spot),(D.chains.SENSEX.spot/D.chains.SENSEX.technicals.last-1)*100],['India VIX',num(K.vix.value),K.vix.change_percent],...g.indices.slice(0,4).map(i=>[i.name,num(i.last),i.change_pct]),['USD/INR',num(g.fx[0].rate),g.fx[0].change_pct],['Crude','$'+num(g.commodities[0].price),g.commodities[0].change_pct],['Gold','$'+num(g.commodities[1].price,0),g.commodities[1].change_pct],['Advance/Decline',B.advancing+' / '+B.declining,null]];
 $('#board').innerHTML=it.map(i=>`<div class="bd"><u>${i[0]}</u><span>${i[1]}</span>${i[2]!=null?`<i class="${cls(i[2])}">${pct(i[2])}</i>`:''}</div>`).join('');
 $('#sess').innerHTML=`<b>${D.session.status==='Closed'?'Closed':esc(D.session.status)}</b> ${esc(D.session.trade_date)}&ensp;Report ${D.savedAt.slice(5,10).replace('-','/')} ${D.savedAt.slice(11,16)}`;
}
function render(){
 $('#tabs').innerHTML=TABS.map((t,i)=>`<button type="button" data-go="${t[0]}" ${state.page===t[0]?'aria-current="page"':''}><kbd>F${i+1}</kbd>${t[1]}</button>`).join('');
 const r=pages[state.page]();
 view.innerHTML=r;
 document.title='Nova Ledger, '+TABS.find(t=>t[0]===state.page)[1].replace('&amp;','&');
}
function go(p,sym){state.page=p;if(sym)state.sym=sym;try{history.replaceState(null,'','#'+p+(p==='SEC'?'/'+state.sym:''))}catch(e){}render()}
function run(raw){
 const q=raw.trim().toUpperCase();if(!q)return;
 const[a,b]=q.split(/\s+/);
 const alias={MKT:'MARKET',MARKET:'MARKET',SEC:'SEC',DES:'SEC',OPT:'OPT',FNO:'OPT',CHAIN:'OPT',FLOW:'FLOWS',FLOWS:'FLOWS',SCREEN:'SCREEN',EQS:'SCREEN',SECTORS:'SECTORS',NOTE:'NOTE',AUDIT:'AUDIT'};
 if(alias[a]){if(alias[a]==='OPT'&&D.chains[b])state.inst=b;if(alias[a]==='SEC'&&BY[b])state.sym=b;return go(alias[a])}
 if(D.chains[a]){state.inst=a;return go('OPT')}
 if(BY[a])return go('SEC',a);
 const h=SCAN.find(r=>r.s.startsWith(a)||r.n.toUpperCase().includes(q));if(h)go('SEC',h.s);
}
/* command box */
const cmd=$('#cmd'),hits=$('#hits');let hi=-1,hl=[];
function suggest(){
 const q=cmd.value.trim().toUpperCase();if(!q){hits.classList.remove('on');return}
 hl=SCAN.filter(r=>r.s.startsWith(q)).concat(SCAN.filter(r=>!r.s.startsWith(q)&&r.n.toUpperCase().includes(q))).slice(0,9);hi=-1;
 hits.innerHTML=hl.map(r=>`<button type="button" data-hit="${r.s}"><b>${r.s}</b><span>${esc(r.n)}</span><b class="${cls(r.r1)}">${pct(r.r1)}</b></button>`).join('');
 hits.classList.toggle('on',hl.length>0);
}
cmd.addEventListener('input',suggest);
cmd.addEventListener('blur',()=>setTimeout(()=>hits.classList.remove('on'),120));
cmd.addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+hl.length)%hl.length;[...hits.children].forEach((c,i)=>c.classList.toggle('a',i===hi))}
 if(e.key==='Escape'){cmd.value='';hits.classList.remove('on');cmd.blur()}
});
$('#cmdf').addEventListener('submit',e=>{e.preventDefault();run(hi>=0?hl[hi].s:cmd.value);cmd.value='';hits.classList.remove('on');cmd.blur()});
hits.addEventListener('mousedown',e=>{const b=e.target.closest('[data-hit]');if(b){go('SEC',b.dataset.hit);cmd.value=''}});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-sort],[data-preset],[data-inst],[data-sym]');if(!t)return;
 const d=t.dataset;
 if(d.go)go(d.go);
 else if(d.inst){state.inst=d.inst;render()}
 else if(d.preset){state.preset=d.preset;render()}
 else if(d.sort){const[id,i]=d.sort.split(':'),s=state.sort[id];state.sort[id]={i:+i,d:s&&s.i===+i?-s.d:1};render()}
 else if(d.sym){if(d.sym[0]==='@'){state.sector=d.sym.slice(1);state.preset='all';go('SCREEN')}else go('SEC',d.sym)}
});
document.addEventListener('input',e=>{if(e.target.id==='sq'){state.q=e.target.value;render();const i=$('#sq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
document.addEventListener('change',e=>{if(e.target.id==='ss'){state.sector=e.target.value;render()}});
document.addEventListener('keydown',e=>{
 const m=e.key.match(/^F([1-8])$/);if(m){e.preventDefault();return go(TABS[+m[1]-1][0])}
 const typing=/INPUT|SELECT|TEXTAREA/.test(e.target.tagName);
 if((e.ctrlKey&&e.key.toLowerCase()==='k')||(e.key==='/'&&!typing)){e.preventDefault();cmd.focus()}
 if(e.key==='Enter'&&e.target.dataset?.sort){e.target.click()}
});
$('#night').addEventListener('click',()=>{const r=document.documentElement,n=r.dataset.theme==='dark';r.dataset.theme=n?'light':'dark';$('#night').textContent=n?'Night':'Day';try{localStorage.setItem('nova-theme',n?'light':'dark')}catch(e){}});
if(document.documentElement.dataset.theme==='dark')$('#night').textContent='Day';
board();
const h0=location.hash.slice(1).split('/');if(pages[h0[0]]){state.page=h0[0];if(BY[h0[1]])state.sym=h0[1]}
render();
</script>
</body>
</html>
