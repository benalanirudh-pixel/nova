<style>
:root{--ground:#1B30E2;--deep:#0C188F;--ink:#FFFFFF;--soft:#D5DCFF;--up:#B4FFE2;--down:#FF9A6B;--pin:#FFE14D;
  --sans:"Bricolage Grotesque",system-ui,sans-serif;--mono:"DM Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font:400 15px/1.3 var(--sans)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
#gl{position:fixed;inset:0;display:block;cursor:grab}
#gl.hit{cursor:pointer}
.hud{position:fixed;z-index:3;pointer-events:none}
.hud>*{pointer-events:auto}

.lead{top:0;left:0;bottom:35px;width:420px;padding:20px 24px;background:var(--deep);pointer-events:none}
.mark{font:800 20px/1 var(--sans);letter-spacing:-.02em;margin-bottom:22px}
.mark span{font-weight:400;color:var(--soft);font-size:14px;letter-spacing:0;margin-left:8px}
h1{margin:0 0 20px;font:800 clamp(32px,3.2vw,50px)/1 var(--sans);letter-spacing:-.03em}
.facts{display:grid;gap:12px;margin:0}
.facts div{display:grid;grid-template-columns:104px 1fr;gap:0 10px;align-items:baseline}
.facts dt{color:var(--soft);font-size:14px}
.facts dd{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.facts small{display:block;font:400 12.5px/1.35 var(--mono);color:var(--soft);letter-spacing:0;margin-top:1px}

.tools{top:18px;right:24px;display:flex;gap:10px;align-items:flex-start}
.find{position:relative}
.find input{width:230px;height:40px;padding:0 12px;border:1.5px solid var(--ink);background:var(--deep);outline:0;font-family:var(--mono);font-size:14px}
.find input::placeholder{color:var(--soft)}
.find input:focus{background:var(--deep)}
#hits{position:absolute;top:100%;left:0;right:0;background:var(--ink);color:var(--deep);display:none;max-height:300px;overflow:auto}
#hits.on{display:block}
#hits button{display:block;width:100%;padding:7px 12px;border:0;background:none;text-align:left;cursor:pointer}
#hits button:hover,#hits button.a{background:var(--pin)}
#hits b{font:500 13px var(--mono);margin-right:8px}
.btn{height:40px;padding:0 13px;background:var(--deep);border:1.5px solid var(--ink);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover,.btn[aria-expanded=true],.btn[aria-pressed=true]{background:var(--ink);color:var(--deep)}

#check{top:68px;right:24px;width:min(340px,calc(100vw - 48px));padding:14px 16px;background:var(--ink);color:var(--deep);display:none}
#check.on{display:block}
#check h2{margin:0 0 8px;font:800 19px/1.1 var(--sans)}
#check p{margin:0;padding:6px 0;border-top:1px solid #c7cef5;font-size:14px}

#card{right:24px;top:72px;width:min(310px,calc(100vw - 48px));padding:16px;background:var(--ink);color:var(--deep);display:none}
#card.on{display:block}
#card h2{margin:0 26px 2px 0;font:800 24px/1.05 var(--sans);letter-spacing:-.02em}
#card .sub{font-size:13.5px;color:#3d4bb0;margin-bottom:10px}
#card .px{font:500 26px/1 var(--mono);margin-bottom:10px}
#card .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border:0;background:none;color:var(--deep);cursor:pointer;font-size:20px}
#card table{width:100%;border-collapse:collapse}
#card td{padding:5px 0;border-top:1px solid #c7cef5;font-size:14px}
#card td+td{text-align:right;font:500 13.5px var(--mono)}
.gain{color:#00795A}.loss{color:#C8370A}

nav.views{bottom:50px;left:calc(50% + 210px);transform:translateX(-50%);display:flex;background:var(--deep)}
nav.views button{height:46px;padding:0 20px;border:0;background:none;cursor:pointer;font-weight:600;font-size:16px;white-space:nowrap}
nav.views button kbd{font:400 11px var(--mono);color:var(--soft);margin-right:6px}
nav.views button:hover{background:#2238d0}
nav.views button[aria-current=page]{background:var(--ink);color:var(--deep)}
nav.views button[aria-current=page] kbd{color:var(--deep)}

#legend{left:24px;bottom:50px;width:372px;font-size:13.5px;color:var(--soft)}
#legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
#legend span{margin-right:12px;white-space:nowrap}
#legend p{margin:0 0 5px}
.seg{margin-top:14px;display:flex;pointer-events:auto}
.seg button{height:34px;padding:0 12px;background:none;border:1.5px solid var(--ink);margin-right:-1.5px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--deep)}

.foot{left:0;right:0;bottom:0;padding:8px 24px;background:var(--deep);font-size:13px;color:var(--soft);display:flex;gap:6px 20px;flex-wrap:wrap;justify-content:space-between}

#labels{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:600 13px/1.15 var(--sans);text-align:center;will-change:transform;background:var(--deep);color:var(--ink);padding:3px 7px}
.lb b{display:block;font:500 12px var(--mono)}
.lb.tap{pointer-events:auto;cursor:pointer;border:0}
.lb.tap:hover{background:var(--pin);color:var(--deep)}
.lb.big{font-size:15px;font-weight:800}
#err{position:fixed;left:24px;bottom:100px;z-index:4;display:none;background:var(--ink);color:var(--deep);padding:10px 14px;max-width:360px}

@media (max-width:820px){
  .lead{top:0;left:0;right:0;bottom:auto;width:auto;padding:12px 16px}
  .mark{margin-bottom:10px}
  h1{font-size:30px;margin-bottom:10px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
  .facts div{display:block}
  .facts dd{font-size:16px}
  .facts small{display:none}
  .tools{top:auto;bottom:100px;left:16px;right:16px}
  .find,.find input{flex:1;width:100%}
  #hits{top:auto;bottom:100%}
  #legend{display:none}
  nav.views{left:0;right:0;transform:none;bottom:42px;justify-content:stretch}
  nav.views button{flex:1;padding:0 4px;font-size:14px}
  nav.views button kbd{display:none}
  #card,#check{top:auto;bottom:150px;left:16px;right:16px;width:auto}
  .foot{padding:6px 16px;font-size:11.5px}
}
</style>
</head>

   const tall=(k,i)=>.05+24*(R.find(r=>r[0]===k)?.[i]||0)/mx;
   L.push({p:[xOf(c.spot),30.2,0],html:`Spot<b>${lc(c.spot,0)}</b>`,big:1},{p:[xOf(c.maxPain),27.2,0],html:`Max pain<b>${lc(c.maxPain,0)}</b>`});
   if(R.some(r=>r[0]===c.callWall))L.push({p:[xOf(c.callWall),tall(c.callWall,1)+1,-3.4],html:`Ceiling<b>${lc(c.callWall,0)}</b>`,big:1});
   if(R.some(r=>r[0]===c.putWall))L.push({p:[xOf(c.putWall),tall(c.putWall,2)+1,3.4],html:`Floor<b>${lc(c.putWall,0)}</b>`,big:1});
   R.forEach((r,i)=>{if(i%5===0)L.push({p:[xOf(r[0]),-.1,8],html:lc(r[0],0)})});
   for(;n<N;n++)put(n,0,-3,0,.001,.001,.001,GROUND);
   return{cam:[-40,27,70],tgt:[0,10,0],labels:L}},
  flows(){const R=D.flows,mx=Math.max(...R.flatMap(r=>[Math.abs(r.f),Math.abs(r.i)])),sp=2.5,base=12,s=11/mx;let n=0;const L=[];
   const tone=(v,p)=>{const c=(v>=0?cU:cD).clone();return p?c:c.lerp(cA,.62)};
   const bar=(v,z,p)=>{const h=Math.max(Math.abs(v)*s,.05);put(n++,0,v>=0?base:base-h,z,1.7,h,2.2,tone(v,p))};
   R.forEach((r,k)=>{const x=(k-(R.length-1)/2)*sp;const a=n;bar(r.f,-2.2,r.p);to[a*W]=x;const b=n;bar(r.i,2.2,r.p);to[b*W]=x;if(k%4===0||k===R.length-1)L.push({p:[x,.2,6.5],html:short(r.d)})});
   put(n++,0,base-.03,0,R.length*sp+4,.06,10,cWhite);
   L.push({p:[(R.length/2)*sp+3,base,-2.2],html:'FII',big:1},{p:[-(R.length/2)*sp-3,base,2.2],html:'DII',big:1});
   for(;n<N;n++)put(n,0,-3,0,.001,.001,.001,GROUND);
   return{cam:[-38,27,72],tgt:[0,10,0],labels:L}}
 };

 /* labels: HTML projected from world space */
 const box=$('#labels');let labels=[];
 function setLabels(a){box.innerHTML='';labels=a.map(l=>{const e=document.createElement(l.tap?'button':'div');e.className='lb'+(l.tap?' tap':'')+(l.big?' big':'');e.innerHTML=l.html;if(l.tap){e.type='button';e.onclick=l.tap}box.append(e);return{e,v:new THREE.Vector3(...l.p)}})}
 const v3=new THREE.Vector3();
 function paintLabels(){const w=innerWidth,h=innerHeight;labels.forEach(l=>{v3.copy(l.v).project(camera);if(v3.z>1){l.e.style.display='none';return}l.e.style.display='';const x=(v3.x+1)/2*w,y=(1-v3.y)/2*h;l.x=x;l.y=y;l.e.style.transform=`translate(-50%,-100%) translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
  if(l.e.classList.contains('tap')){const near=labels.some(o=>o===l?false:o.shown&&labels.indexOf(o)<labels.indexOf(l)&&Math.abs(o.x-x)<118&&Math.abs(o.y-y)<34);l.shown=!near;l.e.style.visibility=near?'hidden':''}})}

 /* motion */
 let morph=null,cam=null;
 const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
 function morphTo(view,first){
  const L=layouts[view]();
  if(first){S.forEach((r,i)=>{const o=i*W;for(let k=0;k<W;k++)cur[o+k]=to[o+k];cur[o+4]=.001;const[x,z]=cityPos[i];delay[i]=calm?0:Math.hypot(x,z)*16})}
  else for(let i=0;i<N;i++)delay[i]=calm?0:Math.random()*380;
  from.set(cur);morph={t0:performance.now(),dur:calm?1:1250,max:(calm?0:(first?1100:380))+(calm?1:1250)};
  setLabels(L.labels);
  flyTo(L.cam,L.tgt,first?2600:1500);
 }
 function flyTo(p,t,ms){cam={t0:performance.now(),ms:calm?1:ms,p0:camera.position.clone(),t0v:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t)}}
 function step(now){
  if(morph){
   const e=now-morph.t0;
   for(let i=0;i<N;i++){const t=Math.min(Math.max((e-delay[i])/morph.dur,0),1),k=ease(t),o=i*W;for(let j=0;j<W;j++)cur[o+j]=from[o+j]+(to[o+j]-from[o+j])*k}
   write();renderer.shadowMap.needsUpdate=true;
   if(e>morph.max+morph.dur){morph=null;mesh.boundingSphere=null;mesh.computeBoundingSphere()}
  }
  if(cam){const t=Math.min((now-cam.t0)/cam.ms,1),k=ease(t);camera.position.lerpVectors(cam.p0,cam.p1,k);controls.target.lerpVectors(cam.t0v,cam.t1,k);if(t>=1)cam=null}
  controls.autoRotate=state.spin&&!cam&&!morph&&state.view==='market'&&!state.sel;controls.autoRotateSpeed=.28;
  controls.update();paintLabels();renderer.render(scene,camera);
 }
 function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  /* keep the model clear of the left text column on wide screens */
  if(w>820)camera.setViewOffset(w,h,-210,0,w,h);else camera.setViewOffset(w,h,0,-h*.1,w,h);camera.updateProjectionMatrix()}
 addEventListener('resize',size);size();

 /* picking */
 const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let downAt=null,hovered=-1,moved=false;
 const hitAt=e=>{ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);const h=ray.intersectObject(mesh)[0];return h?h.instanceId:-1};
 canvas.addEventListener('pointermove',e=>{if(e.buttons||morph||!['market','breadth'].includes(state.view)){canvas.classList.remove('hit');return}if(!moved){moved=true;requestAnimationFrame(()=>{moved=false;hovered=hitAt(e);canvas.classList.toggle('hit',hovered>=0)})}});
 canvas.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];state.spin&&(controls.autoRotate=false)});
 canvas.addEventListener('pointerup',e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5||morph||!['market','breadth'].includes(state.view))return;const i=hitAt(e);if(i>=0)select(S[i])});

 let tint=null;
 let saved=null;
 function clearPin(){if(tint==null)return;const o=tint*W;for(let k=0;k<3;k++)cur[o+6+k]=to[o+6+k]=saved[k];tint=null;write()}
 function select(r,fly){
  clearPin();state.sel=r.s;tint=r.i;const o=r.i*W;saved=[to[o+6],to[o+7],to[o+8]];cur[o+6]=to[o+6]=cPin.r;cur[o+7]=to[o+7]=cPin.g;cur[o+8]=to[o+8]=cPin.b;write();
  showCard(r);$('#check').classList.remove('on');$('#chk').setAttribute('aria-expanded','false');
  if(fly){const x=to[o],y=to[o+1]+to[o+4]/2,z=to[o+2];flyTo([x+17,y+21,z+29],[x,y,z],1300)}
 }
 const word=v=>v>=70?'Stretched':v<=30?'Washed out':'Normal';
 function showCard(r){const c=$('#card');c.className='hud on';c.innerHTML=`<button type="button" class="x" aria-label="Close">×</button><h2>${esc(r.n)}</h2><div class="sub">${r.s}, ${esc(r.x)}</div><div class="px">₹${lc(r.p)}</div><table>
  <tr><td>Today</td><td class="${r.r1>=0?'gain':'loss'}">${pct(r.r1)}</td></tr><tr><td>20 days</td><td class="${r.r20>=0?'gain':'loss'}">${pct(r.r20,1)}</td></tr><tr><td>Trend</td><td>${r.t}</td></tr><tr><td>200-day average</td><td>${r.a200?'Above':'Below'}</td></tr><tr><td>RSI ${lc(r.rsi,0)}</td><td>${word(r.rsi)}</td></tr><tr><td>Volume vs normal</td><td>${lc(r.rv,1)}x</td></tr><tr><td>Value traded</td><td>₹${lc(r.val,1)} Cr</td></tr><tr><td>From 52-week high</td><td>${pct(-Math.abs(r.dh),1)}</td></tr></table>`;c.querySelector('.x').onclick=closeCard}
 function closeCard(){clearPin();state.sel=null;$('#card').className='hud'}
 function pickSector(d){closeCard();const top=[...d.list].sort((a,b)=>b.r1-a.r1)[0];const c=$('#card');c.className='hud on';c.innerHTML=`<button type="button" class="x" aria-label="Close">×</button><h2>${esc(d.name)}</h2><div class="sub">${d.list.length} stocks</div><table><tr><td>Average today</td><td class="${d.avg>=0?'gain':'loss'}">${pct(d.avg)}</td></tr><tr><td>Up / down</td><td>${d.adv} / ${d.list.filter(r=>r.r1<0).length}</td></tr><tr><td>Value traded</td><td>₹${lc(d.val,0)} Cr</td></tr><tr><td>Top mover</td><td>${top.s} ${pct(top.r1,1)}</td></tr></table>`;c.querySelector('.x').onclick=()=>$('#card').className='hud';flyTo([d.cx+18,26,d.cz+34],[d.cx,1,d.cz],1300)}

 window.setView=v=>{if(state.view===v&&v!=='options')return;closeCard();state.view=v;paintHud();morphTo(v)};
 window.findStock=r=>{const go=()=>select(r,true);if(state.view!=='market'&&state.view!=='breadth'){setView('market');setTimeout(go,1750)}else go()};
 window.setInst=i=>{state.inst=i;paintHud();morphTo('options')};
 $('#spin').onclick=()=>{state.spin=!state.spin;$('#spin').setAttribute('aria-pressed',state.spin)};
 addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});

 camera.position.set(0,120,120);controls.target.set(0,0,0);
 morphTo('market',true);write();
 renderer.setAnimationLoop(step);
 window.__nova={renderer,scene,camera};
}
/* page-level controls work before and after the scene loads */
$('#views').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b&&window.setView)setView(b.dataset.view)});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('[data-inst]');if(b&&window.setInst)setInst(b.dataset.inst)});
$('#chk').onclick=()=>{const c=$('#check'),on=c.classList.toggle('on');$('#chk').setAttribute('aria-expanded',on)};
const find=$('#find'),hits=$('#hits');let hl=[],hi=-1;
const suggest=()=>{const q=find.value.trim().toUpperCase();if(!q){hits.classList.remove('on');return}hl=S.filter(r=>r.s.startsWith(q)).concat(S.filter(r=>!r.s.startsWith(q)&&r.n.toUpperCase().includes(q))).slice(0,7);hi=-1;hits.innerHTML=hl.map(r=>`<button type="button" data-hit="${r.s}"><b>${r.s}</b>${esc(r.n.slice(0,24))}</button>`).join('');hits.classList.toggle('on',hl.length>0)};
const choose=r=>{find.value='';hits.classList.remove('on');find.blur();if(r&&window.findStock)findStock(r)};
find.addEventListener('input',suggest);
find.addEventListener('blur',()=>setTimeout(()=>hits.classList.remove('on'),130));
find.addEventListener('keydown',e=>{if((e.key==='ArrowDown'||e.key==='ArrowUp')&&hl.length){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+hl.length)%hl.length;[...hits.children].forEach((c,i)=>c.classList.toggle('a',i===hi))}});
$('#findf').addEventListener('submit',e=>{e.preventDefault();choose(hi>=0?hl[hi]:hl[0])});
hits.addEventListener('mousedown',e=>{const b=e.target.closest('[data-hit]');if(b)choose(BY[b.dataset.hit])});
addEventListener('keydown',e=>{const t=/INPUT/.test(e.target.tagName);if(e.key==='/'&&!t){e.preventDefault();find.focus()}if(!t&&'1234'.includes(e.key)&&window.setView)setView(['market','breadth','options','flows'][e.key-1])});
boot().catch(e=>{const x=$('#err');x.style.display='block';x.textContent='The 3D model could not load. '+(e.message||e)+'. The numbers on this page are still correct.'});
</script>
</body>
