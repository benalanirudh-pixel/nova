<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Desk</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{--bg:#F1F1EE;--panel:#FFFFFF;--raise:#F6F6F3;--line:#DEDED9;--line2:#C4C4BD;--ink:#16171A;--dim:#4C4F55;--faint:#686B72;--up:#0A7A4E;--dn:#C5301C;--acc:#14508F;--accT:#FFFFFF;--read:#7A5310;--hp:10,122,78;--hn:197,48,28;--hatch:rgba(0,0,0,.14)}
:root[data-theme="dark"]{--bg:#0E0F11;--panel:#17181B;--raise:#1F2024;--line:#2B2D32;--line2:#3D3F46;--ink:#EDEDEA;--dim:#B3B5B9;--faint:#94979D;--up:#46C78F;--dn:#F2705C;--acc:#E2C088;--accT:#17181B;--read:#E2C088;--hp:70,199,143;--hn:242,112,92;--hatch:rgba(255,255,255,.15)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0F11;--panel:#17181B;--raise:#1F2024;--line:#2B2D32;--line2:#3D3F46;--ink:#EDEDEA;--dim:#B3B5B9;--faint:#94979D;--up:#46C78F;--dn:#F2705C;--acc:#E2C088;--accT:#17181B;--read:#E2C088;--hp:70,199,143;--hn:242,112,92;--hatch:rgba(255,255,255,.15)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 12.5px/1.35 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:-1px}
.m{font-family:"Geist Mono",Consolas,monospace;font-feature-settings:"tnum" 1}
.app{height:100dvh;display:grid;grid-template-rows:42px 30px minmax(0,1fr) 24px}
.up{color:var(--up)}.dn{color:var(--dn)}.fa{color:var(--faint)}

/* bar */
.top{display:flex;align-items:stretch;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;padding:0 16px;font:600 17px/1 "Source Serif 4",Georgia,serif;letter-spacing:-.01em;border-right:1px solid var(--line)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs button{position:relative;padding:0 13px;border:0;background:none;color:var(--dim);cursor:pointer;font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current=page]{color:var(--ink)}
.tabs button[aria-current=page]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--acc)}
.go{position:relative;flex:1;display:flex;align-items:center;gap:8px;margin:6px 14px;padding:0 9px;min-width:150px;max-width:460px;background:var(--bg);border:1px solid var(--line)}
.go:focus-within{border-color:var(--acc)}
.go input{flex:1;min-width:0;height:28px;border:0;outline:0;background:none;font:400 12.5px "Geist Mono",monospace}
.go input::placeholder{color:var(--faint)}
.go kbd{font:400 10.5px "Geist Mono",monospace;color:var(--faint)}
#hits{position:absolute;z-index:40;left:-1px;right:-1px;top:100%;background:var(--panel);border:1px solid var(--line2);display:none;max-height:340px;overflow:auto}
#hits.on{display:block}
#hits button{display:grid;grid-template-columns:92px 1fr auto;gap:8px;width:100%;padding:6px 9px;border:0;background:none;text-align:left;cursor:pointer}
#hits button:hover,#hits button.a{background:var(--raise)}
.right{margin-left:auto;display:flex;align-items:center;gap:14px;padding:0 12px;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px}
.dot.off{background:var(--faint)}
.tbtn{height:26px;padding:0 9px;background:none;border:1px solid var(--line2);cursor:pointer}
.tbtn:hover{background:var(--raise)}

/* tape */
.tape{display:flex;align-items:stretch;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.t{flex:1 0 auto;display:flex;align-items:center;gap:7px;padding:0 12px;border-right:1px solid var(--line);white-space:nowrap}
.t u{text-decoration:none;color:var(--faint)}
.t b{font:500 12px "Geist Mono",monospace}
.t i{font:400 11.5px "Geist Mono",monospace;font-style:normal}

/* layout */
#view{min-height:0;display:grid;gap:1px;background:var(--line);overflow:hidden}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);overflow:hidden}
.ph{flex:none;display:flex;align-items:center;gap:8px;min-height:28px;padding:0 10px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font:600 12.5px/1 Geist,sans-serif;white-space:nowrap}
.ph .s{flex:1;min-width:0;color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.pad{padding:9px 10px}
.flag{flex:none;display:inline-block;padding:1px 6px;font-size:11px;color:var(--ink);border:1px dashed var(--faint);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 4px)}

table{width:100%;border-collapse:separate;border-spacing:0}
th{position:sticky;top:0;z-index:2;background:var(--panel);font:500 11.5px/1.2 Geist,sans-serif;color:var(--faint);text-align:right;padding:5px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
th.grp{text-align:center;color:var(--dim);border-bottom:1px solid var(--line)}
th.so{cursor:pointer}th.so:hover{color:var(--ink)}
td{font:400 12px/1.25 "Geist Mono",monospace;text-align:right;padding:3.5px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
td.x,th.x{text-align:left}
td.x{font-family:Geist,sans-serif;font-size:12.5px}
td.w{white-space:normal;min-width:170px}
td.b{font-weight:600}
td.xb{font-family:Geist,sans-serif;font-weight:600;text-align:left;font-size:12.5px}
tbody tr[data-sym]{cursor:pointer}
tbody tr[data-sym]:hover td{background:var(--raise)}
tr.on td{background:var(--raise)!important;box-shadow:inset 0 1px 0 var(--line2),inset 0 -1px 0 var(--line2)}
tr.on td:first-child{box-shadow:inset 2px 0 0 var(--acc),inset 0 1px 0 var(--line2),inset 0 -1px 0 var(--line2)}
tr:last-child td{border-bottom:0}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px 14px}
.stats u{display:block;text-decoration:none;color:var(--faint);font-size:11.5px}
.stats b{font:500 13.5px/1.3 "Geist Mono",monospace}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 20px}
.kv div{display:flex;justify-content:space-between;gap:8px;padding:3.5px 0;border-bottom:1px solid var(--line)}
.kv u{text-decoration:none;color:var(--dim)}
.kv b{font:500 12px "Geist Mono",monospace;white-space:nowrap}

/* read voice */
.view{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.who{font-size:11.5px;color:var(--read);font-weight:500}
.view h1{margin:5px 0 8px;font:600 25px/1.14 "Source Serif 4",Georgia,serif;letter-spacing:-.012em}
.view p{margin:0;font:400 14px/1.45 "Source Serif 4",Georgia,serif;color:var(--dim)}
.sig{display:grid;grid-template-columns:96px 1fr;gap:0 8px;padding:5px 0;border-top:1px solid var(--line)}
.sig u{text-decoration:none;color:var(--faint)}
.sig b{font-weight:600}
.sig small{display:block;font:400 11.5px/1.35 "Geist Mono",monospace;color:var(--dim)}
.reads{margin:0;padding:0;list-style:none}
.reads.pad{padding:4px 12px}
.reads li{font:400 14px/1.4 "Source Serif 4",Georgia,serif;padding:6px 0;border-bottom:1px solid var(--line)}
.reads li:last-child{border:0}
.reads em{font:500 11.5px Geist,sans-serif;font-style:normal;color:var(--read);margin-right:6px}

/* quote */
.qh{flex:none;display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 22px;padding:9px 12px;border-bottom:1px solid var(--line)}
.qh h1{margin:0;font:600 21px/1.1 "Source Serif 4",Georgia,serif;letter-spacing:-.01em}
.qh .sub{color:var(--faint);font-size:12px;margin-top:2px}
.px{font:500 23px/1 "Geist Mono",monospace}
.chg{font:500 13px "Geist Mono",monospace;margin-top:3px}
.q{display:flex;flex-wrap:wrap;gap:3px 18px;margin-left:auto}
.q div u{display:block;text-decoration:none;font-size:11px;color:var(--faint)}
.q div b{font:500 12.5px "Geist Mono",monospace}
.tool{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:4px 10px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex}
.seg button{height:23px;padding:0 9px;border:0;background:none;color:var(--dim);cursor:pointer;font-weight:500}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
#legend{font:400 11.5px "Geist Mono",monospace;color:var(--dim);margin-left:auto;white-space:nowrap}
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.blk{background:var(--panel);min-width:0}.blk.wide{grid-column:1/-1}.stack{background:var(--panel)}.stack .blk+.blk{border-top:1px solid var(--line)}
.bh{display:flex;align-items:baseline;gap:8px;padding:7px 10px 4px}.bh.pd{padding-top:12px;border-top:1px solid var(--line)}
.bh h3{margin:0;font:600 12.5px/1.2 Geist,sans-serif;white-space:nowrap}.bh span{color:var(--faint);font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-tabs{flex:none;display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 6px}
.sub-tabs button{height:28px;padding:0 10px;border:0;background:none;color:var(--dim);cursor:pointer;font-weight:500;position:relative}
.sub-tabs button[aria-pressed=true]{color:var(--ink)}
.sub-tabs button[aria-pressed=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:var(--acc)}

/* screen controls */
.bar{flex:none;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.chip{height:26px;padding:0 9px;border:1px solid var(--line2);background:none;cursor:pointer;font-weight:500}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.bar input,.bar select{height:26px;background:var(--bg);border:1px solid var(--line2);padding:0 6px}
.cnt{margin-left:auto;color:var(--faint);font:400 11.5px "Geist Mono",monospace}

.foot{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden}
.foot .k{margin-left:auto;display:flex;gap:12px}
.foot i{display:inline-block;width:12px;height:9px;margin-right:4px}
@media (max-width:1050px){
  html,body{overflow-x:hidden}
  .app{max-width:100vw}
  .tabs{min-width:0}
  .app{height:auto;min-height:100dvh;grid-template-rows:auto 30px auto auto}
  .top{flex-wrap:wrap}.go{order:5;flex-basis:100%;max-width:none;margin:0 10px 6px}.right span:first-child{display:none}
  #view{display:block;overflow:visible}
  .pane{margin-bottom:1px;max-height:none}
  .body{max-height:460px}
  .pane.chartp{height:640px}
  th{position:static}
  .foot{flex-wrap:wrap;white-space:normal;padding:5px 12px}.foot .k{margin-left:0}
}
@media (min-width:2100px){.app{zoom:1.28;height:calc(100dvh/1.28)}}
</style>
</head>

FLOWS(){

function render(){
 $('#tabs').innerHTML=TABS.map((t,i)=>`<button type="button" data-go="${t[0]}" title="F${i+1}" ${st.page===t[0]?'aria-current="page"':''}>${t[1]}</button>`).join('');

function go(p,sym){st.page=p;if(sym){st.sym=sym;st.tab=0}try{history.replaceState(null,'','#'+p+(p==='DESK'?'/'+st.sym:''))}catch(e){}render()}
function run(raw){const q=raw.trim().toUpperCase();if(!q)return;const[a,b]=q.split(/\s+/),al={DESK:'DESK',OPT:'OPT',FNO:'OPT',FLOWS:'FLOWS',FLOW:'FLOWS',SCREEN:'SCREEN',SECTORS:'SECTORS',NOTE:'NOTE',AUDIT:'AUDIT'};if(al[a]){if(al[a]==='OPT'&&D.chains[b])st.inst=b;return go(al[a])}if(IDX[a]||BY[a]||D.stocks[a])return go('DESK',a);const h=SCAN.find(r=>r.s.startsWith(a)||r.n.toUpperCase().includes(q));if(h)go('DESK',h.s)}
const inp=$('#go'),hits=$('#hits');let hi=-1,hl=[];
inp.addEventListener('input',()=>{const q=inp.value.trim().toUpperCase();if(!q){hits.classList.remove('on');return}hl=SCAN.filter(r=>r.s.startsWith(q)).concat(SCAN.filter(r=>!r.s.startsWith(q)&&r.n.toUpperCase().includes(q))).slice(0,8);hi=-1;hits.innerHTML=hl.map(r=>`<button type="button" data-hit="${r.s}"><b class="m">${r.s}</b><span>${esc(r.n.slice(0,30))}</span><span class="m ${cl(r.r1)}">${pc(r.r1)}</span></button>`).join('');hits.classList.toggle('on',hl.length>0)});

inp.addEventListener('keydown',e=>{if((e.key==='ArrowDown'||e.key==='ArrowUp')&&hl.length){e.preventDefault();hi=(hi+(e.key==='ArrowDown'?1:-1)+hl.length)%hl.length;[...hits.children].forEach((c,i)=>c.classList.toggle('a',i===hi))}if(e.key==='Escape'){inp.value='';hits.classList.remove('on');inp.blur()}});
$('#gof').addEventListener('submit',e=>{e.preventDefault();run(hi>=0?hl[hi].s:inp.value);inp.value='';hits.classList.remove('on');inp.blur()});

document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-sort],[data-preset],[data-inst],[data-sym],[data-group],[data-range],[data-tab]');if(!t)return;const d=t.dataset;
 if(d.go)go(d.go);else if(d.inst){st.inst=d.inst;render()}else if(d.preset){st.preset=d.preset;render()}else if(d.group){st.group=+d.group;render()}else if(d.range){st.range=+d.range;render()}else if(d.tab){st.tab=+d.tab;render()}
 else if(d.sort){const[id,i]=d.sort.split(':'),s=st.sort[id];st.sort[id]={i:+i,d:s&&s.i===+i?-s.d:1};render()}

$('#theme').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme==='dark';r.dataset.theme=dk?'light':'dark';$('#theme').textContent=dk?'Graphite':'Day';try{localStorage.setItem('nova-desk-theme',r.dataset.theme)}catch(e){}render()};
