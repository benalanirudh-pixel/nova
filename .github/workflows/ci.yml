name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Dependency-free gate. Nova's full runtime (PySide6, torch, pywin32, numpy,
  # yfinance, ...) is heavy and Windows-specific and is installed via the local
  # venv (see AGENTS.md), not here. So CI verifies what it can without that
  # stack on every push/PR:
  #   1. every .py source byte-compiles (catches syntax/indentation regressions
  #      anywhere in the tree), and
  #   2. the stdlib-only test suite runs.
  # The full 180-test offline suite is run locally with
  #   .\venv\Scripts\python.exe -m unittest discover -s tests
  syntax-and-light-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all sources (exclude virtual envs and caches)
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path

          skip = {"venv", ".venv", "__pycache__", "stt_models", "voices"}
          bad = []
          files = 0
          for p in Path(".").rglob("*.py"):
              if any(part in skip for part in p.parts):
                  continue
              files += 1
              try:
                  ast.parse(p.read_text(encoding="utf-8-sig"), filename=str(p))
              except SyntaxError as exc:
                  bad.append((str(p), str(exc)))
          print(f"parsed {files} source files")
          for path, err in bad:
              print(f"SYNTAX ERROR {path}: {err}")
          sys.exit(1 if bad else 0)
          PY

      - name: Run dependency-free tests (stdlib only)
        run: python -m unittest tests.test_start_nova tests.test_packaging -v
